# Site settings
title: EtherNotes
description: 个人知识笔记 — FPGA、嵌入式、以及各种杂七杂八的东西
theme: minima

# Language & timezone
lang: zh-CN
timezone: Asia/Shanghai

# Author info
author:
  name: Ether
  avatar: /assets/images/avatar.png
  bio: 我是Eetherrr，这里记录我的学习笔记和想法。

# Social
github_username: Eetherrr
qq_number: "941288046"  # 填入你的 QQ 号

# 文章 URL 格式：/fpga/protocol/i2c/i2c-physical/
# categories 由写作规范固定为目录路径（列/子列/[系列]）
permalink: /:categories/:title/

# 默认值：所有文章统一使用 post 布局（单人写作仍建议每篇文章显式声明 layout）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Build plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Minima settings
minima:
  skin: auto
  social_links:
    - platform: github
      user_url: "https://github.com/Eetherrr"

# Exclude from processing (静态/工具文件、待办、本地依赖)
exclude:
  - Gemfile
  - Gemfile.lock
  - TODO.md
  - vendor
  - .obsidian
